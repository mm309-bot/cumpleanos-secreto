<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>❤️</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff5f7;font-family:Georgia,serif;color:#3b2930}
.card{width:min(90vw,480px);padding:45px 25px;background:#fff;border-radius:28px;text-align:center;box-shadow:0 14px 45px rgba(80,35,50,.12)}
.number{font-size:90px;color:#a64d67;margin-bottom:30px}

button{margin-top:14px;padding:13px 30px;border:0;border-radius:14px;background:#a64d67;color:#fff;font-size:17px}
.word{font-size:40px;font-weight:bold;color:#a64d67}
.final{font-size:40px;line-height:1.15;font-weight:bold;color:#a64d67}
.date{font-size:22px;margin-top:18px}
</style></head><body><div class="card"><div class="word">PARA</div></div></body></html>
