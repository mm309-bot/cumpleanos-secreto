<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un secreto para ti ❤️</title>
<style>
:root{--bg:#fff7f7;--ink:#3d2930;--accent:#a64d67;--gold:#c9a45b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff,#fff1f4);color:var(--ink);font-family:Georgia,serif;min-height:100vh;display:grid;place-items:center}
.card{width:min(92vw,520px);background:#fff;border-radius:28px;padding:34px 26px;box-shadow:0 15px 50px #5b26351c;text-align:center}
.heart{font-size:42px}.eyebrow{letter-spacing:.18em;text-transform:uppercase;font:600 12px Arial;color:var(--accent)}
h1{font-size:34px;margin:12px 0}.number{font-size:78px;color:var(--accent);margin:12px 0}
p{font-size:18px;line-height:1.55}.choices{display:grid;gap:10px;margin-top:20px}
button{border:1px solid #e6cbd2;background:#fff8fa;border-radius:14px;padding:14px;font-size:17px;color:var(--ink);cursor:pointer}
button:hover{background:#fcecf0}.msg{margin-top:20px;padding:18px;border-radius:16px;background:#fff4d9;display:none}
.word{font-size:34px;color:var(--accent);font-weight:bold;margin:10px 0}.small{font:13px Arial;color:#806c72;margin-top:22px}
.final{font-size:38px;line-height:1.2;color:var(--accent);font-weight:bold}
</style>
</head>
<body>
<main class="card" id="app"></main>
<script>
const data = {
  "s14": {n:"14", type:"special", correct:"día", reveal:"14 de noviembre de 2031", word:"ALGÚN"},
  "s31": {n:"31", type:"special", correct:"año", reveal:"2031", word:"DÍA"},
  "s11": {n:"11", type:"special", correct:"mes", reveal:"noviembre", word:"QUIERO"},
  "w1": {word:"QUE"}, "w2":{word:"SEAS"}, "w3":{word:"MI"}, "w4":{word:"ESPOSA"}, "w5":{word:"EN"}, "w6":{word:"2031"}
};
const key = new URLSearchParams(location.search).get("c") || "home";
const app=document.getElementById("app");
function showWord(word){
  app.innerHTML=`<div class="heart">❤️</div><div class="eyebrow">Secreto descubierto</div><div class="word">${word}</div><p>Guarda esta palabra. La necesitarás para descubrir el mensaje final.</p>`;
}
function special(d){
 app.innerHTML=`<div class="heart">🔐</div><div class="eyebrow">Una pista especial</div><h1>¿Qué representa este número?</h1><div class="number">${d.n}</div><p>Elige la opción correcta:</p>
 <div class="choices">${["Día","Mes","Año"].map(x=>`<button onclick="check('${x.toLowerCase()}')">${x}</button>`).join("")}</div>
 <div class="msg" id="msg"></div>`;
 window.check=(x)=>{
   const m=document.getElementById("msg");
   if(x===d.correct){
      localStorage.setItem(key,"1");
      m.style.display="block"; m.innerHTML=`<strong>¡Correcto! ❤️</strong><p>${d.reveal}</p><div class="word">${d.word}</div><p>Guarda esta palabra.</p>`;
      checkFinal();
   }else{
      m.style.display="block"; m.innerHTML=`<strong>No es esa…</strong><p>Piensa en una fecha y vuelve a intentarlo.</p>`;
   }
 }
}
function checkFinal(){
 const solved=["s14","s31","s11"].every(k=>localStorage.getItem(k));
 if(solved){
   setTimeout(()=>{app.innerHTML=`<div class="heart">💍</div><div class="eyebrow">El secreto final</div><div class="final">CÁSATE<br>CONMIGO</div><p>14 · 11 · 2031</p><p><em>No ahora. Algún día.</em><br>Primero nos quedan muchos años, aventuras, viajes, risas y recuerdos por vivir.</p><div class="small">Guarda esta fecha. ❤️</div>`},1200)
 }
}
if(data[key]?.type==="special") special(data[key]);
else if(data[key]?.word) showWord(data[key].word);
else app.innerHTML=`<div class="heart">❤️</div><div class="eyebrow">Un pequeño secreto</div><h1>Para ti</h1><p>Escanea uno de los códigos de tus cupones para comenzar.</p>`;
</script>
</body>
</html>
