<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #fff5f7;
  font-family: Georgia, serif;
  color: #3b2930;
}

.card {
  width: min(90vw, 500px);
  padding: 45px 25px;
  background: white;
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 14px 45px rgba(80, 35, 50, 0.12);
}

.numbers {
  font-size: 42px;
  font-weight: bold;
  color: #a64d67;
  margin-bottom: 25px;
  letter-spacing: 6px;
}

.text {
  font-size: 18px;
  line-height: 1.5;
  margin-bottom: 25px;
}

input {
  width: 88%;
  padding: 16px;
  margin: 7px 0;
  border: 1px solid #dfc4cc;
  border-radius: 14px;
  font-size: 20px;
  text-align: center;
  outline: none;
}

button {
  margin-top: 15px;
  padding: 14px 30px;
  border: 0;
  border-radius: 14px;
  background: #a64d67;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.error {
  margin-top: 15px;
  font-size: 16px;
  color: #a64d67;
}

.final {
  font-size: 42px;
  line-height: 1.2;
  font-weight: bold;
  color: #a64d67;
}

.date {
  font-size: 25px;
  margin-top: 22px;
  letter-spacing: 3px;
}

.sub {
  font-size: 18px;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="card" id="card">

  <div class="numbers">
    14 · 31 · 11
  </div>

  <div class="text">
    Hay tres números que esconden una fecha.<br>
    Descubre qué representa cada uno.
  </div>

  <input
    id="dia"
    type="text"
    inputmode="numeric"
    placeholder="Día"
    autocomplete="off"
  >

  <input
    id="mes"
    type="text"
    inputmode="numeric"
    placeholder="Mes"
    autocomplete="off"
  >

  <input
    id="ano"
    type="text"
    inputmode="numeric"
    placeholder="Año"
    autocomplete="off"
  >

  <br>

  <button onclick="descubrir()">
    DESCUBRIR
  </button>

  <div class="error" id="error"></div>

</div>

<script>

function descubrir() {

  const dia = document.getElementById("dia").value.trim();
  const mes = document.getElementById("mes").value.trim();
  const ano = document.getElementById("ano").value.trim();

  if (dia === "14" && mes === "11" && ano === "2031") {

    document.getElementById("card").innerHTML = `

      <div class="final">
        💍<br>
        CÁSATE<br>
        CONMIGO
      </div>

      <div class="date">
        14 · 11 · 2031
      </div>

      <div class="sub">
        <i>No ahora. Algún día.</i> ❤️
      </div>

    `;

  } else {

    document.getElementById("error").textContent = "";

  }

}

</script>

</body>
</html>
