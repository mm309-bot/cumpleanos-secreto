<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff5f7;
  font-family: Georgia, serif;
  color: #3b2930;
}

.card {
  width: 90%;
  max-width: 500px;
  padding: 45px 25px;
  background: white;
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 14px 45px rgba(80,35,50,.12);
}

.numbers {
  font-size: 42px;
  font-weight: bold;
  color: #a64d67;
  margin-bottom: 30px;
}

input {
  display: block;
  width: 88%;
  margin: 10px auto;
  padding: 15px;
  border: 1px solid #dfc4cc;
  border-radius: 14px;
  font-size: 20px;
  text-align: center;
  outline: none;
}

button {
  margin-top: 15px;
  padding: 14px 30px;
  border: none;
  border-radius: 14px;
  background: #a64d67;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.final {
  font-size: 42px;
  line-height: 1.2;
  font-weight: bold;
  color: #a64d67;
}

.date {
  font-size: 25px;
  margin-top: 22px;
  letter-spacing: 3px;
}

.sub {
  font-size: 18px;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="card" id="card">

  <div class="numbers">
    14 · 31 · 11
  </div>

  <input id="dia" type="text" inputmode="numeric" placeholder="Día">

  <input id="mes" type="text" inputmode="numeric" placeholder="Mes">

  <input id="ano" type="text" inputmode="numeric" placeholder="Año">

  <button id="descubrir">
    DESCUBRIR
  </button>

</div>

<script>

document.getElementById("descubrir").addEventListener("click", function() {

  const dia = document.getElementById("dia").value.trim();
  const mes = document.getElementById("mes").value.trim();
  const ano = document.getElementById("ano").value.trim();

  if (dia === "14" && mes === "11" && ano === "2031") {

    document.getElementById("card").innerHTML = `
      <div class="final">
        💍<br>
        CÁSATE<br>
        CONMIGO
      </div>

      <div class="date">
        14 · 11 · 2031
      </div>

      <div class="sub">
        <i>No ahora. Algún día.</i> ❤️
      </div>
    `;

  }

});

</script>

</body>
</html>
